[project]
name = "financial-statements-extractor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.10.0",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
app = [
    "streamlit>=1.67.0",
]
dev = [
    "pytest>=9.2.0",
]
report = [
    "matplotlib>=3.11.2",
    "tabulate>=0.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
